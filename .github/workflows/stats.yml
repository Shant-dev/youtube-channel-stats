name: Refresh YouTube stats
on:
  workflow_dispatch:
  schedule:
    - cron: '1,6,10,14,18,22,26,30,34,38,42,46,50,54,58 * * * *'
permissions:
  contents: read
concurrency:
  group: youtube-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Update Discord message
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 bot.py
